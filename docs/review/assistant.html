<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ask the Assistant</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f3f4f6; --bg-2: #e9ecf1; --card: #ffffff; --card-2: #f0f2f5; --line: #e1e5ea;
    --ink: #121417; --ink-2: #4d5560; --ink-3: #8a929c;
    --ours: #2a78d6; --agent: #8b5cf6; --base: #e39a00;
    --l0: #2a78d6; --l1: #1baf7a; --l2: #0e9aa7; --l3: #eb6834; --l4: #8a6d3b;
    --bad: #d93838; --good: #1f9d55; --warn: #b7791f; --bad-bg: #fbe5e5; --good-bg: #e1f4e9; --warn-bg: #fcf1dd;
    --shadow: 0 1px 2px rgba(16, 20, 26, .05), 0 6px 20px -8px rgba(16, 20, 26, .12);
    --shadow-up: 0 2px 4px rgba(16, 20, 26, .06), 0 14px 32px -10px rgba(16, 20, 26, .22);
    --r: 14px;
    --font: system-ui, -apple-system, "Segoe UI Variable Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, "Cascadia Mono", Consolas, "Courier New", monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0f1114; --bg-2: #15181d; --card: #1a1d22; --card-2: #23272d; --line: #2c3138;
      --ink: #f1f3f5; --ink-2: #a9b1ba; --ink-3: #6f7780;
      --ours: #4b95ee; --agent: #a78bfa; --base: #d99a1a;
      --l0: #4b95ee; --l1: #22b07e; --l2: #2bb3c0; --l3: #e0662f; --l4: #b08a5a;
      --bad: #ee6b6b; --good: #3cc279; --warn: #dca13a; --bad-bg: #3a2023; --good-bg: #173527; --warn-bg: #3a2f1c;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px -10px rgba(0, 0, 0, .6);
      --shadow-up: 0 2px 4px rgba(0, 0, 0, .5), 0 16px 36px -10px rgba(0, 0, 0, .8);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0f1114; --bg-2: #15181d; --card: #1a1d22; --card-2: #23272d; --line: #2c3138;
    --ink: #f1f3f5; --ink-2: #a9b1ba; --ink-3: #6f7780;
    --ours: #4b95ee; --agent: #a78bfa; --base: #d99a1a;
    --l0: #4b95ee; --l1: #22b07e; --l2: #2bb3c0; --l3: #e0662f; --l4: #b08a5a;
    --bad: #ee6b6b; --good: #3cc279; --warn: #dca13a; --bad-bg: #3a2023; --good-bg: #173527; --warn-bg: #3a2f1c;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px -10px rgba(0, 0, 0, .6);
    --shadow-up: 0 2px 4px rgba(0, 0, 0, .5), 0 16px 36px -10px rgba(0, 0, 0, .8);
  }
  html { font-size: 15px; }
  html.big { font-size: 18px; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; color: var(--ink); font-family: var(--font); font-size: 1rem; line-height: 1.45;
    background: radial-gradient(1200px 420px at 50% -120px, var(--bg-2), transparent 70%), var(--bg); }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 18px 16px 48px; }
  h1 { font-size: 2rem; font-weight: 750; margin: 0; letter-spacing: -0.025em; line-height: 1.1; }
  h2 { font-size: 1.05rem; font-weight: 680; margin: 0; letter-spacing: -0.01em; }
  h3 { font-size: .9rem; font-weight: 650; margin: 0; color: var(--ink-2); }
  p { margin: 0; color: var(--ink-2); max-width: 78ch; }
  code, .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .top { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: flex-end; justify-content: space-between; margin-top: 10px; }
  .sub { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; font-size: 1rem; }
  .badge { display: inline-flex; align-items: center; gap: 6px; font-size: .78rem; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: var(--card-2); color: var(--ink-2); white-space: nowrap; }
  .badge.good { background: var(--good-bg); color: var(--good); }
  .badge.bad { background: var(--bad-bg); color: var(--bad); }
  .badge.warn { background: var(--warn-bg); color: var(--warn); }
  .tools { display: flex; gap: 6px; }
  .tools button { font: inherit; font-size: .85rem; font-weight: 650; width: 2.3rem; height: 2.3rem; border-radius: 50%; border: none; background: var(--card); color: var(--ink-2); cursor: pointer; box-shadow: var(--shadow); }
  .tools button:hover { color: var(--ink); }
  :focus-visible { outline: 2px solid var(--ours); outline-offset: 2px; }

  /* the navigation bar: one pill per page */
  .sitenav { display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 4px; border-radius: 999px; background: var(--card); box-shadow: var(--shadow); font-size: .82rem; }
  .sitenav a { color: var(--ink-2); text-decoration: none; padding: 5px 13px; border-radius: 999px; transition: background .15s, color .15s; }
  .sitenav a:hover { color: var(--ink); background: var(--card-2); }
  .sitenav a[aria-current="page"] { color: var(--bg); background: var(--ink); font-weight: 650; }

  /* hero numbers */
  .funnel { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-top: 18px; }
  .fn { background: var(--card); border-radius: var(--r); padding: 12px 14px 11px; box-shadow: var(--shadow); position: relative; overflow: hidden; }
  .fn::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 4px; background: var(--c, var(--line)); }
  .fn .v { font-size: 2rem; font-weight: 760; font-variant-numeric: tabular-nums; letter-spacing: -0.03em; line-height: 1.1; color: var(--c-v, var(--ink)); }
  .fn .l { font-size: .72rem; color: var(--ink-3); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; margin-top: 3px; }
  .fn.hero { --c: var(--good); --c-v: var(--good); }

  /* the stepper */
  .steps { display: flex; gap: 6px; margin-top: 20px; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; padding: 2px; }
  .steps button { flex: 1 0 auto; font: inherit; font-size: .92rem; font-weight: 600; background: var(--card); border: none; border-radius: 999px; padding: 8px 14px 8px 8px; color: var(--ink-2); cursor: pointer; white-space: nowrap; display: inline-flex; gap: 9px; align-items: center; box-shadow: var(--shadow); transition: background .2s, color .2s, transform .15s; }
  .steps button:hover { transform: translateY(-1px); color: var(--ink); }
  .steps button .n { display: inline-grid; place-items: center; width: 1.6rem; height: 1.6rem; border-radius: 50%; background: var(--card-2); font-size: .8rem; font-weight: 750; transition: background .2s, color .2s; }
  .steps button[aria-selected="true"] { background: var(--ink); color: var(--bg); }
  .steps button[aria-selected="true"] .n { background: var(--bg); color: var(--ink); }
  .steps button.seen:not([aria-selected="true"]) .n { background: var(--good-bg); color: var(--good); }
  .pane { padding-top: 16px; display: grid; gap: 14px; }
  .pane[hidden] { display: none; }
  .lead { font-size: 1.05rem; color: var(--ink-2); max-width: 90ch; }
  .lead b { color: var(--ink); font-weight: 650; }

  .card { background: var(--card); border-radius: var(--r); padding: 16px; min-width: 0; box-shadow: var(--shadow); }
  .card .head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 6px 14px; margin-bottom: 12px; }
  .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
  .split { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 14px; align-items: start; }
  @media (max-width: 860px) { .split { grid-template-columns: 1fr; } }
  .muted { color: var(--ink-3); font-size: .84rem; }
  .note { font-size: .88rem; color: var(--ink-2); background: var(--card-2); border-radius: 10px; padding: 8px 12px; }

  /* shared pieces */
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .78rem; color: var(--ink-3); margin-top: 10px; }
  .legend span { display: inline-flex; gap: 6px; align-items: center; }
  .lk { width: 11px; height: 11px; border-radius: 3px; display: inline-block; flex: none; }
  table { border-collapse: collapse; width: 100%; font-size: .88rem; }
  th, td { padding: 7px 9px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  th { font-size: .72rem; color: var(--ink-3); font-weight: 650; white-space: nowrap; text-transform: uppercase; letter-spacing: .05em; }
  td.n, th.n { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
  tbody tr, table tr { transition: background .12s; }
  .scroll { overflow-x: auto; }
  .seg { display: inline-flex; border-radius: 999px; background: var(--card-2); flex-wrap: wrap; padding: 3px; gap: 2px; }
  .seg button { font: inherit; font-size: .86rem; font-weight: 600; border: none; background: none; padding: 5px 12px; cursor: pointer; color: var(--ink-2); border-radius: 999px; transition: background .15s, color .15s; }
  .seg button:hover { color: var(--ink); }
  .seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }
  select { font: inherit; font-size: .88rem; padding: 5px 10px; border: none; border-radius: 999px; background: var(--card-2); color: var(--ink); }
  footer { margin-top: 28px; font-size: .76rem; color: var(--ink-3); }
  footer code { font-family: var(--mono); }
  kbd { font-family: var(--mono); font-size: .72rem; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: var(--card); }

  /* bars: grow in whenever their pane is shown */
  .track { height: 14px; background: var(--card-2); border-radius: 999px; overflow: hidden; }
  .track i { display: block; height: 100%; border-radius: 999px; transform-origin: left center; animation: grow .9s cubic-bezier(.2, .8, .2, 1) both; }
  .barrow { display: grid; grid-template-columns: minmax(140px, 250px) 1fr 64px; gap: 10px; align-items: center; font-size: .88rem; padding: 5px 0; }
  .barrow:nth-child(2) .track i { animation-delay: .05s; } .barrow:nth-child(3) .track i { animation-delay: .1s; }
  .barrow:nth-child(4) .track i { animation-delay: .15s; } .barrow:nth-child(5) .track i { animation-delay: .2s; }
  .barrow:nth-child(n+6) .track i { animation-delay: .25s; }

  /* motion: a pane's children rise in when it is shown */
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes pop { 0% { transform: scale(.9); opacity: 0; } 60% { transform: scale(1.03); opacity: 1; } 100% { transform: scale(1); } }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
  .pane > *, .funnel > * { animation: rise .45s cubic-bezier(.2, .8, .2, 1) both; }
  .pane > :nth-child(2), .funnel > :nth-child(2) { animation-delay: .05s; }
  .pane > :nth-child(3), .funnel > :nth-child(3) { animation-delay: .1s; }
  .pane > :nth-child(4), .funnel > :nth-child(4) { animation-delay: .15s; }
  .pane > :nth-child(5), .funnel > :nth-child(5) { animation-delay: .2s; }
  .pane > :nth-child(n+6), .funnel > :nth-child(n+6) { animation-delay: .25s; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

  .roles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 18px; }
  @media (max-width: 760px) { .roles { grid-template-columns: 1fr; } }
  .role { text-align: left; font: inherit; color: var(--ink); background: var(--card); border: none; border-radius: var(--r); padding: 12px 14px; cursor: pointer; display: grid; gap: 6px; box-shadow: var(--shadow); transition: transform .12s, box-shadow .12s; animation: rise .4s both; }
  .role:nth-child(2) { animation-delay: .05s; } .role:nth-child(3) { animation-delay: .1s; }
  .role:hover { transform: translateY(-2px); box-shadow: var(--shadow-up); }
  .role[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
  .role .rt { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .role .rn { font-weight: 750; text-transform: capitalize; font-size: 1.15rem; letter-spacing: -0.01em; }
  .role .rc { font-size: .8rem; font-weight: 650; opacity: .75; font-variant-numeric: tabular-nums; }
  .cats { display: flex; flex-wrap: wrap; gap: 4px; }
  .cat { font-size: .64rem; letter-spacing: .04em; text-transform: uppercase; font-weight: 650; padding: 2px 7px; border-radius: 999px; background: var(--card-2); color: var(--ink-2); }
  .cat.clinical { background: var(--good-bg); color: var(--good); }
  .cat.financial { background: var(--warn-bg); color: var(--warn); }
  .cat.direct_identifier, .cat.contact { background: var(--bad-bg); color: var(--bad); }

  .main { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: 14px; align-items: start; margin-top: 14px; }
  @media (max-width: 900px) { .main { grid-template-columns: 1fr; } }
  .chat { display: grid; grid-template-rows: auto 1fr auto; height: 600px; padding: 0; overflow: hidden; }
  .chat .bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); gap: 10px; flex-wrap: wrap; }
  .log { overflow-y: auto; padding: 16px; display: grid; gap: 10px; align-content: start; scroll-behavior: smooth; }
  .msg { max-width: 88%; padding: 10px 13px; border-radius: 16px; font-size: .92rem; white-space: pre-wrap; overflow-wrap: anywhere; animation: rise .3s both; }
  .msg.you { justify-self: end; background: var(--ours); color: #fff; border-bottom-right-radius: 5px; }
  .msg.bot { justify-self: start; background: var(--card-2); border-bottom-left-radius: 5px; white-space: normal; }
  .msg.bot.declined { background: var(--bad-bg); }
  .msg.bot.guidance { background: var(--card); border: 1px solid var(--line); max-width: 100%; }
  .msg .who { font-size: .66rem; opacity: .7; margin-bottom: 3px; text-transform: uppercase; letter-spacing: .06em; font-weight: 650; }
  .msg.you .who { text-align: right; }
  .typing { display: inline-flex; gap: 4px; padding: 4px 2px; }
  .typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); animation: pulse 1s infinite; }
  .typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
  .gtitle { font-weight: 750; margin-bottom: 6px; }
  .gstep { display: grid; grid-template-columns: 1.8rem 1fr; gap: 2px 8px; margin: 8px 0; animation: rise .3s both; }
  .gstep .no { display: grid; place-items: center; width: 1.5rem; height: 1.5rem; border-radius: 50%; background: var(--ours); color: #fff; font-weight: 750; font-size: .78rem; }
  .where { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .where span { font-family: var(--mono); font-size: .7rem; padding: 1px 7px; border-radius: 999px; background: var(--card-2); color: var(--ink-2); }
  .where span.page { background: var(--good-bg); color: var(--good); font-weight: 650; }
  .caution { font-size: .78rem; color: var(--warn); margin-top: 4px; }
  .gfoot { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
  .rulechip { display: inline-block; font-family: var(--mono); font-size: .78rem; font-weight: 750; padding: 2px 9px; border-radius: 999px; background: var(--bad); color: #fff; margin-top: 6px; animation: pop .4s both .15s; }
  .opts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .opt { font: inherit; font-size: .84rem; border: none; background: var(--card); color: var(--ink); border-radius: 999px; padding: 5px 12px; cursor: pointer; box-shadow: var(--shadow); transition: transform .12s; }
  .opt:hover { transform: translateY(-1px); }
  .bar .opt { background: var(--card-2); box-shadow: none; }
  .compose { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--line); background: var(--card); }
  .compose input { font: inherit; padding: 9px 14px; border: none; border-radius: 999px; background: var(--card-2); color: var(--ink); min-width: 0; }
  .compose button, .bar button.plain { font: inherit; font-size: .88rem; font-weight: 650; padding: 8px 14px; border-radius: 999px; border: none; background: var(--card-2); color: var(--ink); cursor: pointer; }
  .compose button.send { background: var(--ours); color: #fff; }
  .compose button.scenes { background: var(--ink); color: var(--bg); }
  .compose button:disabled, .compose input:disabled { opacity: .5; cursor: not-allowed; }
  .suggest { display: flex; flex-wrap: wrap; gap: 6px; }

  .why h2 { margin-bottom: 4px; }
  .why .fnline { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 6px; }
  .why .check { display: grid; grid-template-columns: 2rem 1fr; gap: 2px 10px; padding: 10px 0; border-bottom: 1px solid var(--line); animation: rise .3s both; }
  .why .check:last-of-type { border-bottom: none; }
  .mark { width: 1.7rem; height: 1.7rem; border-radius: 50%; display: grid; place-items: center; font-weight: 750; font-size: .85rem; animation: pop .35s both; animation-delay: inherit; }
  .mark.ok { background: var(--good-bg); color: var(--good); }
  .mark.no { background: var(--bad); color: #fff; }
  .mark.skip { background: var(--card-2); color: var(--ink-3); }
  .why .cn { font-weight: 680; font-size: .9rem; }
  .why .cn .r { font-family: var(--mono); font-size: .78rem; color: var(--ink-3); margin-right: 6px; }
  .why .cd { font-size: .78rem; color: var(--ink-2); }
  .verdict { margin-top: 10px; padding: 12px 14px; border-radius: 12px; font-weight: 750; font-size: 1.05rem; animation: pop .4s both; }
  .verdict.ok { background: var(--good-bg); color: var(--good); }
  .verdict.no { background: var(--bad-bg); color: var(--bad); }
  .empty { color: var(--ink-3); font-size: .9rem; margin-top: 8px; }
  .pages { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
  .pages code { font-size: .74rem; padding: 2px 8px; border-radius: 999px; background: var(--good-bg); color: var(--good); font-weight: 650; }

  .matrix td, .matrix th { text-align: center; }
  .matrix td:first-child, .matrix th:first-child { text-align: left; }
  .cell { font: inherit; font-family: var(--mono); font-size: .74rem; font-weight: 750; border: none; border-radius: 999px; padding: 4px 10px; cursor: pointer; min-width: 64px; transition: transform .12s; }
  .cell.ok { background: var(--good-bg); color: var(--good); }
  .cell.no { background: var(--bad-bg); color: var(--bad); }
  .cell:hover { transform: scale(1.08); }
</style>

<div class="wrap">
  <nav class="sitenav" aria-label="Demo pages"><a href="index.html">Demos</a><a href="portal-run.html">Portal run</a><a href="dataset-walkthrough.html">Dataset</a><a href="assistant.html" aria-current="page">Assistant</a><a href="../benchmark_results/rules-vs-just-ai.html">Rules vs AI</a></nav>
  <div class="top">
    <div>
      <h1>Ask the assistant</h1>
      <p class="sub">Steps for your role, or a refusal, before anything is asked. <span class="badge" id="count"></span><span id="selftest" class="badge"></span></p>
    </div>
    <div class="tools">
      <button id="bigger" title="Larger text for a projector">A+</button>
      <button id="theme" title="Light / dark">◐</button>
    </div>
  </div>

  <div class="roles" id="roles"></div>

  <div class="main">
    <div class="card chat">
      <div class="bar">
        <div class="suggest" id="suggest"></div>
        <button class="plain" id="reset" title="Start a new conversation">↺ New</button>
      </div>
      <div class="log" id="log" aria-live="polite"></div>
      <form class="compose" id="compose" autocomplete="off">
        <input id="input" placeholder="What do you need?" aria-label="Your request">
        <button type="submit" class="send" id="send">Send</button>
        <button type="button" class="scenes" id="play" title="Play the four scenes from the live pipeline">▶ Scenes</button>
      </form>
    </div>
    <div class="card why" id="why"></div>
  </div>

  <div class="card" style="margin-top:14px">
    <div class="head"><h2>Who may be walked through what</h2><span class="muted">click a cell</span></div>
    <div class="scroll"><table class="matrix" id="matrix"></table></div>
  </div>

<script>
/* Shared by every demo page (inlined at build time): the header buttons, the
   stepper, and numbers that count up when their pane comes into view. */
window.Kit = (() => {
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;

  // <span data-count="440" data-dp="0" data-suffix="×">440</span> counts up from zero.
  function countIn(root) {
    (root || document).querySelectorAll("[data-count]").forEach((el) => {
      const to = Number(el.dataset.count), dp = Number(el.dataset.dp || 0), suf = el.dataset.suffix || "";
      const fmt = (v) => (dp ? v.toFixed(dp) : Math.round(v).toLocaleString("en-US")) + suf;
      if (still || !isFinite(to)) { el.textContent = fmt(to); return; }
      const t0 = performance.now(), dur = 900;
      const tick = (t) => {
        const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3);
        el.textContent = fmt(to * e);
        if (k < 1) requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    });
  }
  const count = (v, dp = 0, suffix = "") => `<span data-count="${v}" data-dp="${dp}" data-suffix="${suffix}">${dp ? Number(v).toFixed(dp) : Number(v).toLocaleString("en-US")}${suffix}</span>`;

  // Tabs as steps: number keys and arrows move, the hash remembers, each pane animates on entry.
  function steps(n, onEnter) {
    const btns = [...document.querySelectorAll("#steps button")];
    let now = 1;
    function go(k) {
      k = Number(k);
      if (k < 1 || k > n) return;
      btns.forEach((b) => {
        const on = Number(b.dataset.step) === k;
        b.setAttribute("aria-selected", String(on));
        if (Number(b.dataset.step) === now && !on) b.classList.add("seen");
      });
      for (let i = 1; i <= n; i++) document.getElementById("pane-" + i).hidden = i !== k;
      now = k;
      try { history.replaceState(null, "", "#" + k); } catch (e) {}
      const pane = document.getElementById("pane-" + k);
      countIn(pane);
      if (onEnter) onEnter(k, pane);
    }
    btns.forEach((b) => b.addEventListener("click", () => go(b.dataset.step)));
    document.addEventListener("keydown", (e) => {
      if (e.target.matches("input, select, textarea") || e.metaKey || e.ctrlKey || e.altKey) return;
      if (new RegExp(`^[1-${n}]$`).test(e.key)) go(e.key);
      else if (e.key === "ArrowRight") go(now + 1);
      else if (e.key === "ArrowLeft") go(now - 1);
    });
    const h = Number(location.hash.replace("#", ""));
    return { go, now: () => now, start: () => go(h >= 1 && h <= n ? h : 1) };
  }

  function tools() {
    const big = document.getElementById("bigger"), theme = document.getElementById("theme");
    if (big) big.addEventListener("click", () => document.documentElement.classList.toggle("big"));
    if (theme) theme.addEventListener("click", () => {
      const r = document.documentElement, dark = r.dataset.theme === "dark" || (!r.dataset.theme && matchMedia("(prefers-color-scheme: dark)").matches);
      r.dataset.theme = dark ? "light" : "dark";
    });
  }
  tools();
  return { countIn, count, steps, still };
})();

<script>
(() => {
  const D = JSON.parse(document.getElementById("data").textContent);

  function recognise(text) {
    const req = [...tokens(text)];
    if (!req.length) return [];
    const scored = D.order.map((id) => [req.filter((w) => SPEC[id].has(w)).length, id]);
    const best = Math.max(...scored.map((s) => s[0]));
    if (best === 0) return [];
    return scored.filter((s) => s[0] === best).map((s) => s[1]);

  function renderGuidance(role, id, inputs) {
    const f = F[id], p = D.purposes[f.purpose];
    const lines = [`How to ${f.label} -- for ${role}`, ""];
    f.steps.forEach((s, i) => {
      lines.push(`  ${i + 1}. ${s.text.replace(/\{(\w+)\}/g, (m, k) => (k in inputs ? inputs[k] : m))}`);
      lines.push(`     [${s.layer} / ${s.artefact}${s.page ? " / " + s.page : ""}]`);
      if (s.caution) lines.push(`     note: ${s.caution}`);
    });
    lines.push("", `  purpose      : ${f.purpose} (${p.note})`, `  data touched : ${f.touched}`,
      `  retain       : no longer than ${p.days} days for this purpose`);
    return lines.join("\n");
  }
  class Session {
    constructor(role) { this.role = role; this.reset(); }
    reset() { this.state = "idle"; this.options = []; this.spec = null; this.inputs = {}; }
    respond(text) {
      text = text.trim();
      if (this.state === "choosing") return this.choose(text);
      if (this.state === "collecting") return this.collect(text);
      return this.start(text);
    }
    start(text) {
      const m = recognise(text);
      if (!m.length) return { kind: "unrecognised", fn: null, text: R[this.role].unrecognised };
      if (m.length > 1) {
        this.options = m; this.state = "choosing";
        return { kind: "ask_choose", fn: null, text: ["I can help with a few things that sound like that -- which one?", ...m.map((id, i) => `  ${i + 1}. ${F[id].label}`)].join("\n") };
      }
      return this.begin(m[0]);
    }
    choose(text) {
      let chosen = null;
      if (/^[0-9]+$/.test(text) && +text >= 1 && +text <= this.options.length) chosen = this.options[+text - 1];
      else {
        const low = text.toLowerCase();
        chosen = this.options.find((id) => low === id || low === F[id].label.toLowerCase()) || null;
        if (!chosen) { const n = recognise(text).filter((id) => this.options.includes(id)); if (n.length === 1) chosen = n[0]; }
      }
      if (!chosen) return { kind: "ask_choose", fn: null, text: ["Sorry -- pick one by number:", ...this.options.map((id, i) => `  ${i + 1}. ${F[id].label}`)].join("\n") };

      return this.begin(chosen);

    begin(id) {
      const gate = R[this.role].gate[id];
      if (!gate.allowed) { this.reset(); return { kind: "declined", fn: id, text: R[this.role].decline[id] }; }
      this.spec = id; this.inputs = {};
      if (!F[id].inputs.length) return this.finish();
      this.state = "collecting";
      return this.askNext(`Sure -- to ${F[id].label} I need a couple of details.`);
    }
    collect(text) {
      const f = F[this.spec], slot = f.inputs[Object.keys(this.inputs).length];
      if (!text) return { kind: "ask_input", fn: this.spec, text: `${slot.prompt} (e.g. ${slot.example})` };
      this.inputs[slot.name] = text;
      if (Object.keys(this.inputs).length === f.inputs.length) return this.finish();
      return this.askNext();

      const slot = F[this.spec].inputs[Object.keys(this.inputs).length];

    }

  /* ---------------------------------------------------- self-check against the Python transcripts */
  let mismatch = null;
  for (const v of D.vectors) {
    const s = new Session(v.role);

  $("selftest").textContent = LIVE
    ? `✓ identical to the Python assistant · ${D.vectors.length} conversations`

  function replay(turns) {

  function botHTML(r) {

          if (w) { const parts = w[1].split(" / "); where = parts.map((p, k) => `<span class="${k === 2 ? "page" : ""}">${esc(p)}</span>`).join(""); i++; }
          const c = (lines[i + 1] || "").match(/^\s+note: (.*)$/);
          if (c) { note = `<div class="caution">⚑ ${esc(c[1])}</div>`; i++; }
          h += `<div class="gstep" style="animation-delay:${(n++) * 120}ms"><span class="no">${m[1]}</span><div>${esc(m[2])}<div class="where">${where}</div>${note}</div></div>`;
        }
        i++;
      }
      const foot = lines.slice(i + 1).map((l) => l.match(/^\s+(\w[\w ]*?)\s+: (.*)$/)).filter(Boolean);
      h += `<div class="gfoot">${foot.map((m) => `<span class="badge" title="${esc(m[2])}">${esc(m[1])}: ${esc(m[2].replace(/ \(.*\)$/, ""))}</span>`).join("")}</div>`;
      return h;
    }
    if (r.kind === "declined") {
      const rule = lines.find((l) => /^\s+\[/.test(l)) || "";

      return `<b>${esc(lines[0])}</b><div>${rest.map((l) => esc(l.trim())).join("<br>")}</div><span class="rulechip">${esc(rule.trim().replace(/^\[|\]$/g, ""))}</span>`;
    }
    if (r.kind === "ask_choose" || r.kind === "unrecognised") {
      const head = lines.filter((l) => !/^\s+(\d+\.|-) /.test(l));
      const opts = lines.map((l) => l.match(/^\s+(?:(\d+)\.|-) (.*)$/)).filter(Boolean);
      return `${head.map(esc).join("<br>")}<div class="opts">${opts.map((m) => `<button class="opt" data-say="${esc(m[1] || m[2])}">${esc(m[2])}</button>`).join("")}</div>`;
    }
    if (r.kind === "ask_input") {
      const ex = r.text.match(/\(e\.g\. (.*)\)$/);
      return esc(r.text).replace(/\n/g, "<br>") + (ex ? `<div class="opts"><button class="opt" data-say="${esc(ex[1])}">use ${esc(ex[1])}</button></div>` : "");
    }
    return esc(r.text);
  }
  function add(kind, html, cls = "") {
    const div = document.createElement("div");

    $("why").innerHTML = `<h2>Why this answer</h2><div class="fnline"><span class="badge">${esc(f.label)}</span><span class="badge">${esc(f.purpose.replace(/_/g, " "))}</span>${f.artefacts.map((a) => `<span class="badge">${esc(a)}</span>`).join("")}</div>${checks}`
      + (g.allowed
        ? `<div class="verdict ok" style="animation-delay:${after}ms">✓ Allowed for ${esc(role)}</div>` + (pages.length ? `<div class="pages">${pages.map((p) => `<code>${esc(p)}</code>`).join("")}</div>` : "")
        : `<div class="verdict no" style="animation-delay:${after}ms">✗ Declined · ${esc(g.rule)}<div class="muted" style="font-weight:500;margin-top:2px">${esc(g.provision)} · nothing asked first</div></div>`);
  }
  function setRole(r) {
    epoch++;
    role = r; session = new Session(role); history = [];
    $("log").innerHTML = ""; $("why").innerHTML = `<h2>Why this answer</h2><p class="empty">Ask something — the three checks appear here.</p>`;
    paintRoles(); paintSuggest();
  }
  function paintRoles() {
    $("roles").innerHTML = D.roles.map((r) => {
      const n = D.functions.filter((f) => r.gate[f.id].allowed).length;
      return `<button class="role" aria-pressed="${r.id === role}" data-r="${r.id}" title="${esc(r.description)}"><span class="rt"><span class="rn">${esc(r.id)}</span><span class="rc">${n} of ${D.functions.length}</span></span>`
        + `<span class="cats">${r.may_touch.map((c) => `<span class="cat ${c}">${esc(c.replace(/_/g, " "))}</span>`).join("")}</span></button>`;
    }).join("");
    $("roles").querySelectorAll(".role").forEach((b) => b.addEventListener("click", () => { if (!busy) setRole(b.dataset.r); }));
  }
  function paintSuggest() {
    const mine = D.functions.filter((f) => R[role].gate[f.id].allowed).slice(0, 2).map((f) => f.synonyms[0] || f.label);
    const refused = D.functions.find((f) => !R[role].gate[f.id].allowed);
    const picks = [...mine, refused ? refused.synonyms[0] || refused.label : null, "tell me a joke"].filter(Boolean);
    $("suggest").innerHTML = picks.map((p) => `<button class="opt" data-say="${esc(p)}">${esc(p)}</button>`).join("");
    $("suggest").querySelectorAll(".opt").forEach((b) => b.addEventListener("click", () => { if (!busy) { session.reset(); history = []; say(b.dataset.say); } }));
  }
  function paintMatrix() {
    $("matrix").innerHTML = `<tr><th>Function</th><th>Purpose</th>${D.roles.map((r) => `<th>${esc(r.id)}</th>`).join("")}</tr>`
      + D.functions.map((f) => `<tr><td>${esc(f.label)}</td><td class="muted">${esc(f.purpose.replace(/_/g, " "))}</td>`
        + D.roles.map((r) => { const g = r.gate[f.id]; return `<td><button class="cell ${g.allowed ? "ok" : "no"}" data-r="${r.id}" data-f="${f.id}" title="${esc(g.reason)}">${g.allowed ? "✓" : esc(g.rule)}</button></td>`; }).join("") + "</tr>").join("");
    $("matrix").querySelectorAll(".cell").forEach((b) => b.addEventListener("click", () => {
      if (busy) return;
      const f = F[b.dataset.f];
      setRole(b.dataset.r);
      window.scrollTo({ top: $("roles").offsetTop - 10, behavior: "smooth" });
      autoplay([f.label, ...(R[b.dataset.r].gate[f.id].allowed ? f.inputs.map((i) => i.example) : [])]);
    }));
  }

  /* ---------------------------------------------------- autoplay: type each turn, then send */
  async function type(text) {
    const box = $("input");
    box.value = "";
    for (const ch of text) { box.value += ch; await wait(22); }
    await wait(250);
    box.value = "";
  }
  async function autoplay(turns) {
    const mine = epoch;
    busy = true; lock(true);
    for (const t of turns) { if (mine !== epoch) break; await type(t); await say(t); await wait(700); }
    busy = false; lock(false);
  }
  function lock(on) { ["input", "send", "play"].forEach((id) => { $(id).disabled = on || (!LIVE && id !== "play"); }); }
  $("play").addEventListener("click", async () => {
    if (busy) return;
    for (const scene of D.scenes) { setRole(scene.role); await autoplay(scene.turns); await wait(1400); }
  });
  $("compose").addEventListener("submit", (e) => { e.preventDefault(); if (busy || !LIVE) return; const t = $("input").value; $("input").value = ""; say(t); });
  $("reset").addEventListener("click", () => { if (!busy) setRole(role); });

  setRole(role); paintMatrix(); lock(false);
  $("foot").innerHTML = `Built by <code>tools/build_assistant_page.py</code> from <code>src/agent/</code> and the portal's navigation map · checked against ${D.vectors.length} recorded Python conversations on every open`;
})();
</script>
