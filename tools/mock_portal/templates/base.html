<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{% block title %}HIS Portal{% endblock %}</title>
<style>
  body { font-family: Arial, sans-serif; margin: 0; color: #222; }
  header { background: #1d2f82; color: #fff; padding: 10px 18px; display: flex; justify-content: space-between; align-items: center; }
  header a { color: #fff; margin-right: 14px; text-decoration: none; }
  main { padding: 18px; }
  table { border-collapse: collapse; width: 100%; }
  th, td { border: 1px solid #ccc; padding: 6px 8px; text-align: left; font-size: 14px; }
  th { background: #eef; }
  .pager a, .pager span { margin-right: 10px; }
  .card { border: 1px solid #ccc; padding: 12px; margin: 8px 0; }
  .error { color: #a00; }
  form.search input { padding: 4px; }
</style>
</head>
<body>
<header>
  <nav>
    <a href="{{ url_for('home') }}"><strong>HIS Portal</strong></a>
    {% if user %}{% for slug, title in modules %}<a href="{{ url_for('module_list', slug=slug) }}">{{ title }}</a>{% endfor %}{% endif %}
  </nav>
  <div>{% if user %}Signed in as {{ user }} &middot; <a href="{{ url_for('logout') }}">Sign out</a>{% endif %}</div>
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
