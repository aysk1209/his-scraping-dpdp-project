<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ask the Assistant</title>
<style>
/*__BASE__*/
  .roles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 18px; }
  @media (max-width: 760px) { .roles { grid-template-columns: 1fr; } }
  .role { text-align: left; font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; cursor: pointer; display: grid; gap: 6px; }
  .role:hover { border-color: var(--ink-3); }
  .role[aria-pressed="true"] { border-color: var(--ours); background: color-mix(in srgb, var(--ours) 7%, var(--card)); }
  .role .rt { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .role .rn { font-family: var(--display); font-weight: 600; text-transform: capitalize; font-size: 1.1rem; }
  .role .rc { font-size: .8rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .cats { display: flex; flex-wrap: wrap; gap: 4px; }
  .cat { font-size: .72rem; font-weight: 600; padding: 1px 6px; border-radius: var(--rr); background: var(--card-2); color: var(--ink-2); }
  .cat.clinical { background: var(--good-bg); color: var(--good); }
  .cat.financial { background: var(--warn-bg); color: var(--warn); }
  .cat.direct_identifier, .cat.contact { background: var(--bad-bg); color: var(--bad); }

  .main { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: 14px; align-items: start; margin-top: 14px; }
  @media (max-width: 900px) { .main { grid-template-columns: 1fr; } }
  .chat { display: grid; grid-template-rows: auto 1fr auto; height: 600px; padding: 0; overflow: hidden; }
  .chat .bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); gap: 10px; flex-wrap: wrap; }
  .log { overflow-y: auto; padding: 16px; display: grid; gap: 10px; align-content: start; scroll-behavior: smooth; }
  .msg { max-width: 88%; padding: 10px 13px; border-radius: var(--r); font-size: .92rem; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.you { justify-self: end; background: color-mix(in srgb, var(--ours) 12%, var(--card)); border: 1px solid transparent; }
  .msg.bot { justify-self: start; border: 1px solid var(--line); white-space: normal; }
  .msg.bot.declined { background: var(--bad-bg); border-color: transparent; }
  .msg.bot.guidance { max-width: 100%; }
  .msg .who { font-size: .76rem; color: var(--ink-3); margin-bottom: 2px; text-transform: capitalize; }
  .msg.you .who { text-align: right; }
  .gtitle { font-weight: 600; margin-bottom: 6px; }
  .gstep { display: grid; grid-template-columns: 1.8rem 1fr; gap: 2px 8px; margin: 8px 0; }
  .gstep .no { font-weight: 600; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .where { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .where span { font-family: var(--mono); font-size: .72rem; color: var(--ink-3); }
  .where span:not(:last-child)::after { content: " /"; }
  .where span.page { color: var(--good); background: var(--good-bg); border-radius: 2px; padding: 0 4px; font-weight: 600; }
  .caution { font-size: .78rem; color: var(--warn); margin-top: 4px; }
  .gfoot { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
  .rulechip { display: inline-block; font-family: var(--mono); font-size: .78rem; font-weight: 600; padding: 1px 7px; border-radius: var(--rr); background: color-mix(in srgb, var(--bad) 14%, var(--card)); color: var(--bad); margin-top: 6px; }
  .opts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .grp { font-size: .76rem; font-weight: 600; color: var(--ink-3); margin-top: 10px; }
  .chg { padding-left: 12px; position: relative; font-size: .88rem; margin-top: 3px; }
  .chg::before { content: "–"; position: absolute; left: 0; color: var(--ink-3); }
  .opt { font: inherit; font-size: .84rem; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: var(--r); padding: 3px 10px; cursor: pointer; }
  .opt:hover { border-color: var(--ink-3); }
  .compose { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--line); background: var(--card); }
  .compose input { font: inherit; padding: 6px 10px; border: 1px solid var(--line); border-radius: var(--r); background: var(--card); color: var(--ink); min-width: 0; }
  .compose button, .bar button.plain { display: inline-flex; align-items: center; gap: 6px; font: inherit; font-size: .88rem; font-weight: 600; padding: 5px 12px; border-radius: var(--r); border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer; }
  .compose button:hover, .bar button.plain:hover { background: var(--card-2); }
  .compose button.send { background: var(--ours); border-color: var(--ours); color: var(--on-fill); }
  .compose button.send:hover { background: color-mix(in srgb, var(--ours) 85%, var(--ink)); }
  .compose button:disabled, .compose input:disabled { opacity: .5; cursor: not-allowed; }
  .suggest { display: flex; flex-wrap: wrap; gap: 6px; }

  .why h2 { margin-bottom: 4px; }
  .why .fnline { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 6px; }
  .why .check { display: grid; grid-template-columns: 2rem 1fr; gap: 2px 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .why .check:last-of-type { border-bottom: none; }
  .mark { display: grid; place-items: center; font-weight: 600; font-size: 1rem; padding-top: 1px; }
  .mark.ok { color: var(--good); }
  .mark.no { color: var(--bad); }
  .mark { width: 1.6rem; height: 1.6rem; border-radius: 50%; }
  .mark.ok { background: var(--good-bg); }
  .mark.no { background: var(--bad-bg); }
  .mark.skip { color: var(--ink-3); }
  .why .cn { font-weight: 600; font-size: .9rem; }
  .why .cn .r { font-family: var(--mono); font-size: .78rem; color: var(--ink-3); margin-right: 6px; }
  .why .cd { font-size: .78rem; color: var(--ink-2); }
  .verdict { margin-top: 10px; padding: 9px 12px; border-radius: var(--r); font-weight: 600; border: 1px solid; }
  .verdict.ok { color: var(--good); border-color: transparent; background: var(--good-bg); }
  .verdict.no { color: var(--bad); border-color: transparent; background: var(--bad-bg); }
  .empty { color: var(--ink-3); font-size: .9rem; margin-top: 8px; }
  .pages { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
  .pages code { font-size: .76rem; color: var(--good); background: var(--good-bg); border-radius: var(--rr); padding: 1px 6px; }

  .matrix td, .matrix th { text-align: center; }
  .matrix td:first-child, .matrix th:first-child { text-align: left; }
  .cell { font: inherit; font-family: var(--mono); font-size: .8rem; border: 1px solid transparent; border-radius: var(--rr); background: none; padding: 2px 8px; cursor: pointer; min-width: 56px; }
  .cell:hover { border-color: var(--line); }
  .cell.ok { color: var(--good); background: var(--good-bg); }
  .cell.no { color: var(--bad); background: var(--bad-bg); }
</style>

<div class="wrap">
  <!--__NAV__-->
  <div class="top">
    <div>
      <h1>Ask the assistant</h1>
      <p class="sub">Steps for your role, or a refusal, before anything is asked. <span class="badge" id="count"></span><span id="selftest" class="badge"></span></p>
    </div>
    <div class="tools">
      <button id="bigger" title="Larger text for a projector">A+</button>
      <button id="theme"></button>
    </div>
  </div>

  <div class="roles" id="roles"></div>

  <div class="main">
    <div class="card chat">
      <div class="bar">
        <div class="suggest" id="suggest"></div>
        <button class="plain" id="reset" title="Start a new conversation"><span data-icon="replay"></span> New</button>
      </div>
      <div class="log" id="log" aria-live="polite"></div>
      <form class="compose" id="compose" autocomplete="off">
        <input id="input" placeholder="What do you need?" aria-label="Your request">
        <button type="submit" class="send" id="send">Send</button>
        <button type="button" class="scenes" id="play" title="Play the four scenes from the live pipeline"><span data-icon="play"></span> Scenes</button>
      </form>
    </div>
    <div class="card why" id="why"></div>
  </div>

  <div class="card" style="margin-top:14px">
    <div class="head"><h2>Who may be walked through what</h2><span class="muted">click a cell</span></div>
    <div class="scroll"><table class="matrix" id="matrix"></table></div>
  </div>

  <footer id="foot"></footer>
</div>

<script id="data" type="application/json">/*__DATA__*/null</script>
<script>
/*__KIT__*/
</script>
<script>
(() => {
  const D = JSON.parse(document.getElementById("data").textContent);
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const F = Object.fromEntries(D.functions.map((f) => [f.id, f]));
  const R = Object.fromEntries(D.roles.map((r) => [r.id, r]));

  /* ---------------------------------------------------- the engine (mirrors agent/session.py) */
  const STOP = new Set(D.stopwords);
  const SPEC = Object.fromEntries(Object.entries(D.tokens).map(([k, v]) => [k, new Set(v)]));
  const words = (t) => t.toLowerCase().match(/[a-z0-9]+/g) || [];
  const norm = (t) => words(t).join(" ");
  const tokens = (t) => new Set(words(t).filter((w) => !STOP.has(w)));
  function recognise(text) {
    const req = [...tokens(text)];
    if (!req.length) return [];
    const said = ` ${norm(text)} `;
    const scored = D.order.map((id) => [req.filter((w) => SPEC[id].has(w)).length
      + D.phraseWeight * D.phrases[id].filter((p) => said.includes(` ${p} `)).length, id]);
    const best = Math.max(...scored.map((s) => s[0]));
    if (best === 0) return [];
    return scored.filter((s) => s[0] === best).map((s) => s[1]);
  }
  const fits = (slot, answer) => slot.pattern === null || new RegExp(`^(?:${slot.pattern})$`, "i").test(answer.trim());
  function foundIn(slot, text) {
    if (slot.find === null) return null;
    const m = text.match(new RegExp(slot.find, "i"));
    return m ? m[0] : null;
  }
  function renderGuidance(role, id, inputs) {
    const f = F[id], p = D.purposes[f.purpose];
    const lines = [`How to ${f.label} -- for ${role}`, ""];
    if (f.withheld) lines.push(D.texts.withheldHead, "");
    f.steps.forEach((s, i) => {
      lines.push(`  ${i + 1}. ${s.text.replace(/\{(\w+)\}/g, (m, k) => (k in inputs ? inputs[k] : m))}`);
      lines.push(`     [${s.layer} / ${s.artefact}${s.where ? " / " + s.where : ""}]`);
      if (s.caution) lines.push(`     note: ${s.caution}`);
    });
    lines.push("", `  purpose      : ${f.purpose} (${p.note})`, `  data touched : ${f.touched}`,
      `  retain       : no longer than ${p.days} days for this purpose`);
    if (D.screensAsOf) lines.push(`  screens      : as found on ${D.screensAsOf}`);
    return lines.join("\n");
  }
  class Session {
    constructor(role) { this.role = role; this.reset(); }
    reset() { this.state = "idle"; this.options = []; this.spec = null; this.inputs = {}; this.request = ""; }
    respond(text) {
      text = text.trim();
      const cmd = norm(text);
      if (D.commands.help.includes(cmd)) return this.help();
      if (D.commands.changes.includes(cmd)) return { kind: "changes", fn: null, text: R[this.role].changes };
      if (D.commands.cancel.includes(cmd)) {
        if (this.state === "idle") return { kind: "cancelled", fn: null, text: D.texts.nothing };
        this.reset();
        return { kind: "cancelled", fn: null, text: D.texts.cancelled };
      }
      if (this.state === "choosing") return this.choose(text);
      if (this.state === "collecting") return this.collect(text);
      return this.start(text);
    }
    start(text) {
      let m = recognise(text);
      if (!m.length) return { kind: "unrecognised", fn: null, text: R[this.role].unrecognised };
      this.request = text;
      if (m.length > 1) {
        const mine = m.filter((id) => R[this.role].gate[id].allowed);
        if (mine.length === 1) return this.begin(mine[0]);
        m = mine.length ? mine : m;
        this.options = m; this.state = "choosing";
        return { kind: "ask_choose", fn: null, text: ["I can help with a few things that sound like that -- which one?", ...m.map((id, i) => `  ${i + 1}. ${F[id].label}`)].join("\n") };
      }
      return this.begin(m[0]);
    }
    chooseAgain() {
      return { kind: "ask_choose", fn: null, text: ["Sorry -- pick one by number:", ...this.options.map((id, i) => `  ${i + 1}. ${F[id].label}`)].join("\n") };
    }
    choose(text) {
      let chosen = null;
      if (/^[0-9]+$/.test(text) && +text >= 1 && +text <= this.options.length) chosen = this.options[+text - 1];
      else {
        const low = text.toLowerCase();
        chosen = this.options.find((id) => low === id || low === F[id].label.toLowerCase()) || null;
        if (!chosen) { const n = recognise(text).filter((id) => this.options.includes(id)); if (n.length === 1) chosen = n[0]; }
      }
      if (!chosen) return this.chooseAgain();
      this.options = [];
      return this.begin(chosen);
    }
    begin(id) {
      const gate = R[this.role].gate[id];
      if (!gate.allowed) { this.reset(); return { kind: "declined", fn: id, text: R[this.role].decline[id] }; }
      this.spec = id; this.inputs = {};
      for (const s of F[id].inputs) { const v = foundIn(s, this.request); if (v !== null && fits(s, v)) this.inputs[s.name] = v; }
      const taken = Object.entries(this.inputs);
      if (taken.length === F[id].inputs.length) return this.finish();
      this.state = "collecting";
      let pre = `Sure -- to ${F[id].label} I need a couple of details.`;
      if (taken.length) pre += "\n(From your message: " + taken.map(([k, v]) => `${k} ${v}`).join(", ") + ".)";
      return this.askNext(pre);
    }
    pending() { return F[this.spec].inputs.find((s) => !(s.name in this.inputs)); }
    collect(text) {
      const slot = this.pending();
      if (!text) return { kind: "ask_input", fn: this.spec, text: `${slot.prompt} (e.g. ${slot.example})` };
      if (!fits(slot, text)) return { kind: "ask_input", fn: this.spec, text: `${D.texts.misfit}\n${slot.prompt} (e.g. ${slot.example})` };
      this.inputs[slot.name] = text;
      if (Object.keys(this.inputs).length === F[this.spec].inputs.length) return this.finish();
      return this.askNext();
    }
    askNext(preface) {
      const slot = this.pending();
      const t = `${slot.prompt} (e.g. ${slot.example})`;
      return { kind: "ask_input", fn: this.spec, text: preface ? `${preface}\n${t}` : t };
    }
    help() {
      if (this.state === "collecting") {
        const slot = this.pending();
        return { kind: "ask_input", fn: this.spec, text: `(Say "cancel" to stop.) To ${F[this.spec].label} I still need this:\n${slot.prompt} (e.g. ${slot.example})` };
      }
      if (this.state === "choosing") return this.chooseAgain();
      return { kind: "help", fn: null, text: R[this.role].help };
    }
    finish() {
      const id = this.spec, text = renderGuidance(this.role, id, this.inputs);
      this.reset();
      return { kind: "guidance", fn: id, text };
    }
  }

  /* ---------------------------------------------------- self-check against the Python transcripts */
  let mismatch = null;
  for (const v of D.vectors) {
    const s = new Session(v.role);
    for (let i = 0; i < v.turns.length && !mismatch; i++) {
      const got = s.respond(v.turns[i]), want = v.replies[i];
      if (got.text !== want.text || got.kind !== want.kind) mismatch = { v, i, got, want };
    }
    if (mismatch) break;
  }
  const LIVE = !mismatch;
  $("selftest").className = "badge " + (LIVE ? "good" : "bad");
  $("selftest").innerHTML = LIVE
    ? `${Kit.icon("check")} identical to the Python assistant · ${D.vectors.length} conversations`
    : `typing off: differs from the Python assistant`;
  if (mismatch) console.warn("assistant page self-check mismatch", mismatch);
  $("count").textContent = `${D.functions.length} functions · no model`;

  /* ---------------------------------------------------- state */
  let role = "reception", session = new Session(role), history = [], busy = false, epoch = 0;
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));

  function replay(turns) {
    // Typing is off: answer only from a recorded Python conversation with this exact prefix.
    const v = D.vectors.concat(D.scenes).find((c) => c.role === role && turns.every((t, i) => c.turns[i] === t));
    return v ? v.replies[turns.length - 1] : { kind: "unrecognised", fn: null, text: "(Typing is off on this page — pick a suggestion or a cell in the table.)" };
  }
  function respond(text) {
    history.push(text);
    return LIVE ? session.respond(text) : replay(history);
  }

  /* ---------------------------------------------------- rendering */
  function botHTML(r) {
    const lines = r.text.split("\n");
    if (r.kind === "guidance") {
      let h = `<div class="gtitle">${esc(lines[0])}</div>`, i = 2, n = 0;
      if (lines[2] === D.texts.withheldHead) { h += `<div class="caution">${Kit.icon("flag")} ${esc(lines[2].trim())}</div>`; i = 4; }
      const steps = (F[r.fn] || { steps: [] }).steps;
      while (i < lines.length && lines[i] !== "") {
        const m = lines[i].match(/^  (\d+)\. (.*)$/);
        if (m) {
          let where = "", note = "";
          if (/^\s+\[(.*)\]$/.test(lines[i + 1] || "")) {
            const st = steps[n] || {};
            where = [st.layer, st.artefact, st.where].filter(Boolean).map((p, k) => `<span class="${k === 2 ? "page" : ""}">${esc(p)}</span>`).join("");
            i++;
          }
          const c = (lines[i + 1] || "").match(/^\s+note: (.*)$/);
          if (c) { note = `<div class="caution">${Kit.icon("flag")} ${esc(c[1])}</div>`; i++; }
          h += `<div class="gstep"><span class="no">${m[1]}</span><div>${esc(m[2])}<div class="where">${where}</div>${note}</div></div>`;
          n++;
        }
        i++;
      }
      const foot = lines.slice(i + 1).map((l) => l.match(/^\s+(\w[\w ]*?)\s+: (.*)$/)).filter(Boolean);
      h += `<div class="gfoot">${foot.map((m) => `<span class="badge" title="${esc(m[2])}">${esc(m[1])}: ${esc(m[2].replace(/ \(.*\)$/, ""))}</span>`).join("")}</div>`;
      return h;
    }
    if (r.kind === "declined") {
      const rule = lines.find((l) => /^\s+\[/.test(l)) || "";
      const rest = lines.filter((l) => l !== rule).slice(1);
      return `<b>${esc(lines[0])}</b><div>${rest.map((l) => esc(l.trim())).join("<br>")}</div><span class="rulechip">${esc(rule.trim().replace(/^\[|\]$/g, ""))}</span>`;
    }
    if (r.kind === "ask_choose" || r.kind === "unrecognised" || r.kind === "help") {
      let h = "", opts = [];
      const flush = () => { if (opts.length) { h += `<div class="opts">${opts.join("")}</div>`; opts = []; } };
      for (const l of lines) {
        const m = l.match(/^\s+(?:(\d+)\.|-) (.*)$/);
        if (m) { opts.push(`<button class="opt" data-say="${esc(m[1] || m[2])}">${esc(m[2])}</button>`); continue; }
        flush();
        const g = l.match(/^\s+(.*):$/);
        h += g ? `<div class="grp">${esc(g[1])}</div>` : `<div>${esc(l)}</div>`;
      }
      flush();
      return h;
    }
    if (r.kind === "changes") {
      return `<b>${esc(lines[0])}</b>` + lines.slice(1).map((l) => `<div class="${/^\s+- /.test(l) ? "chg" : ""}">${esc(l.replace(/^\s+- /, "").trim())}</div>`).join("");
    }
    if (r.kind === "ask_input") {
      const ex = r.text.match(/\(e\.g\. (.*)\)$/);
      return esc(r.text).replace(/\n/g, "<br>") + (ex ? `<div class="opts"><button class="opt" data-say="${esc(ex[1])}">use ${esc(ex[1])}</button></div>` : "");
    }
    return esc(r.text);
  }
  function add(kind, html, cls = "") {
    const div = document.createElement("div");
    div.className = `msg ${kind} ${cls}`;
    div.innerHTML = `<div class="who">${kind === "you" ? esc(role) : "assistant"}</div>` + html;
    $("log").appendChild(div);
    div.querySelectorAll(".opt").forEach((b) => b.addEventListener("click", () => { if (!busy) say(b.dataset.say); }));
    $("log").scrollTop = $("log").scrollHeight;
    return div;
  }
  async function say(text) {
    const mine = epoch, was = busy;
    busy = true;
    add("you", esc(text || "(nothing)"));
    const r = respond(text);
    if (mine !== epoch) { busy = was; return; }
    add("bot", botHTML(r), r.kind);
    why(r);
    busy = was;
  }
  function why(r) {
    if (!r.fn) {
      const said = {
        ask_choose: "Several functions match and this role may use more than one of them — it asks rather than guesses.",
        help: "The menu is this role's tasks, read off the same gate as every answer.",
        cancelled: "Dropped. Nothing typed for that request was kept.",
        changes: "Read off the comparison of the last two crawls of the HIS.",
      }[r.kind] || "No function matched. It offers only what this role may do.";
      $("why").innerHTML = `<h2>Why this answer</h2><p class="empty">${said}</p>`;
      return;
    }
    const f = F[r.fn], g = R[role].gate[r.fn];
    let stopped = false;
    const checks = g.checks.map((c, i) => {
      const state = stopped ? "skip" : (c.ok ? "ok" : "no");
      if (!c.ok) stopped = true;
      return `<div class="check"><span class="mark ${state}">${state === "ok" ? Kit.icon("check") : state === "no" ? Kit.icon("x") : "·"}</span><div><div class="cn"><span class="r">${esc(c.rule)}</span>${esc(c.name)}</div><div class="cd">${esc(c.detail)}${state === "skip" ? " · not reached" : ""}</div></div></div>`;
    }).join("");
    const pages = [...new Set(f.steps.map((s) => s.page).filter(Boolean))];
    const after = g.checks.length * 220 + 80;
    $("why").innerHTML = `<h2>Why this answer</h2><div class="fnline"><span class="badge">${esc(f.label)}</span><span class="badge">${esc(f.purpose.replace(/_/g, " "))}</span>${f.artefacts.map((a) => `<span class="badge">${esc(a)}</span>`).join("")}</div>${checks}`
      + (g.allowed
        ? `<div class="verdict ok">${Kit.icon("check")} Allowed for ${esc(role)}</div>` + (pages.length ? `<div class="pages">${pages.map((p) => `<code>${esc(p)}</code>`).join("")}</div>` : "")
        : `<div class="verdict no">${Kit.icon("x")} Declined · ${esc(g.rule)}<div class="muted" style="font-weight:500;margin-top:2px">${esc(g.provision)} · nothing asked first</div></div>`);
  }
  function setRole(r) {
    epoch++;
    role = r; session = new Session(role); history = [];
    $("log").innerHTML = ""; $("why").innerHTML = `<h2>Why this answer</h2><p class="empty">Ask something — the three checks appear here.</p>`;
    paintRoles(); paintSuggest();
  }
  function paintRoles() {
    $("roles").innerHTML = D.roles.map((r) => {
      const n = D.functions.filter((f) => r.gate[f.id].allowed).length;
      return `<button class="role" aria-pressed="${r.id === role}" data-r="${r.id}" title="${esc(r.description)}"><span class="rt"><span class="rn">${esc(r.id)}</span><span class="rc">${n} of ${D.functions.length}</span></span>`
        + `<span class="cats">${r.may_touch.map((c) => `<span class="cat ${c}">${esc(c.replace(/_/g, " "))}</span>`).join("")}</span></button>`;
    }).join("");
    $("roles").querySelectorAll(".role").forEach((b) => b.addEventListener("click", () => { if (!busy) setRole(b.dataset.r); }));
  }
  function paintSuggest() {
    const mine = D.functions.filter((f) => R[role].gate[f.id].allowed).slice(0, 2).map((f) => f.synonyms[0] || f.label);
    const refused = D.functions.find((f) => !R[role].gate[f.id].allowed);
    const picks = [...mine, refused ? refused.synonyms[0] || refused.label : null, "help", "tell me a joke"].filter(Boolean);
    $("suggest").innerHTML = picks.map((p) => `<button class="opt" data-say="${esc(p)}">${esc(p)}</button>`).join("");
    $("suggest").querySelectorAll(".opt").forEach((b) => b.addEventListener("click", () => { if (!busy) { session.reset(); history = []; say(b.dataset.say); } }));
  }
  function paintMatrix() {
    $("matrix").innerHTML = `<tr><th>Function</th><th>Purpose</th>${D.roles.map((r) => `<th>${esc(r.id)}</th>`).join("")}</tr>`
      + D.functions.map((f) => `<tr><td>${esc(f.label)}</td><td class="muted">${esc(f.purpose.replace(/_/g, " "))}</td>`
        + D.roles.map((r) => { const g = r.gate[f.id]; return `<td><button class="cell ${g.allowed ? "ok" : "no"}" data-r="${r.id}" data-f="${f.id}" title="${esc(g.reason)}">${g.allowed ? Kit.icon("check") : esc(g.rule)}</button></td>`; }).join("") + "</tr>").join("");
    $("matrix").querySelectorAll(".cell").forEach((b) => b.addEventListener("click", () => {
      if (busy) return;
      const f = F[b.dataset.f];
      setRole(b.dataset.r);
      window.scrollTo({ top: $("roles").offsetTop - 10, behavior: "smooth" });
      autoplay([f.label, ...(R[b.dataset.r].gate[f.id].allowed ? f.inputs.map((i) => i.example) : [])]);
    }));
  }

  /* ---------------------------------------------------- autoplay: type each turn, then send */
  async function type(text) {
    const box = $("input");
    box.value = "";
    for (const ch of text) { box.value += ch; await wait(22); }
    await wait(250);
    box.value = "";
  }
  async function autoplay(turns) {
    const mine = epoch;
    busy = true; lock(true);
    for (const t of turns) { if (mine !== epoch) break; await type(t); await say(t); await wait(700); }
    busy = false; lock(false);
  }
  function lock(on) { ["input", "send", "play"].forEach((id) => { $(id).disabled = on || (!LIVE && id !== "play"); }); }
  $("play").addEventListener("click", async () => {
    if (busy) return;
    for (const scene of D.scenes) { setRole(scene.role); await autoplay(scene.turns); await wait(1400); }
  });
  $("compose").addEventListener("submit", (e) => { e.preventDefault(); if (busy || !LIVE) return; const t = $("input").value; $("input").value = ""; say(t); });
  $("reset").addEventListener("click", () => { if (!busy) setRole(role); });

  setRole(role); paintMatrix(); lock(false);
  $("foot").innerHTML = `Built by <code>tools/build_assistant_page.py</code> from <code>src/agent/</code> and the portal's navigation map · checked against ${D.vectors.length} recorded Python conversations on every open`;
})();
</script>
